[package]
name = "irradiance-demo-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Runs irradiance's RAW pipeline and keeps every stage, for the Anatomy of a RAW demo (native and wasm32)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The published crate, exactly as an adopter would use it.
irradiance = "0.2.6"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
